seed: 42
method: proposed
data:
  tusimple: data/tusimple
  day: data/dashcam/day
  night: data/dashcam/night
  rain: data/dashcam/rain
pipeline:
  default_data_source: day
  color_threshold: true
  roi: true
  # Camera homography is uncalibrated for these dashcam clips; keep fits in
  # image coordinates until per-camera source/destination points are measured.
  perspective: false
  sliding_windows: true
  previous_fit_search: true
  kalman: true
  warning: true
  hough: false
  # Use Canny/Hough only after the sliding-window pair is rejected.  This
  # keeps the display straight and bounded instead of drawing an extrapolated
  # curve from a reflection or road seam.
  straight_line_fallback: true
  fallback_minimum_support_norm: 0.05
preprocess:
  canny_low: 50
  canny_high: 150
  gaussian_kernel:
  - 5
  - 5
  roi_polygon: null
  roi_reference_size: [1280, 720]
  roi_polygon_by_source:
    day:
    - [500, 350]
    - [780, 350]
    - [1200, 719]
    - [80, 719]
    night:
    - [450, 350]
    - [850, 350]
    - [1280, 719]
    - [0, 719]
    rain:
    - [517, 350]
    - [770, 350]
    - [1182, 719]
    - [98, 719]
  hough:
    threshold: 30
    min_line_length: 60
    max_line_gap: 80
  hough_by_source:
    night: {threshold: 20, min_line_length: 32, max_line_gap: 56}
    rain: {threshold: 18, min_line_length: 28, max_line_gap: 48}
  auto_canny: true
  canny_sigma: 0.33
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  canny_by_source:
    night: {clahe_clip_limit: 3.0, canny_sigma: 0.4}
    rain: {clahe_clip_limit: 4.0, canny_sigma: 0.1}
  min_abs_slope: 0.4
  min_abs_slope_by_source:
    night: 0.2
    rain: 0.2
  max_abs_slope: 4.0
  baseline_marking_filter: true
  baseline_marking_dilation_by_source:
    night: 15
    rain: 11
  yellow_h_range:
  - 15
  - 35
  yellow_s_min: 100
  white_l_min: 200
  yellow_h_range_by_source:
    night: [12, 42]
    rain: [12, 42]
  yellow_s_min_by_source:
    night: 55
    rain: 65
  white_l_min_by_source:
    night: 135
    rain: 155
  lane_clahe_clip_by_source:
    night: 2.5
    rain: 2.0
  lane_clahe_tile_grid: [8, 8]
  sobel_x_kernel: 3
  sobel_x_threshold: null
  dash_close_kernel: [1, 15]
homography:
  tusimple:
    source: [[598, 300], [747, 300], [1247, 630], [301, 630]]
    destination: [[320, 0], [960, 0], [960, 719], [320, 719]]
  day:
    source: null
    destination: null
  night:
    source: null
    destination: null
  rain:
    source: null
    destination: null
fit:
  window_count: 12
  window_margin: 200
  recenter_min_pixels: 2
  min_fit_points: null
  search_margin: null
  # A pair narrower than this is normally the two strokes of a centre line,
  # not the lane surrounding the ego vehicle.
  min_lane_width_norm: 0.12
  max_lane_width_norm: 0.60
  expected_lane_width_px: null
  lane_width_min_px: null
  lane_width_max_px: null
  parallel_tolerance: null
  max_abs_quadratic: null
  valid_y_top_norm: null
  valid_y_bottom_norm: null
  valid_x_margin_norm: 0.015
  fit_y_margin_norm: 0.05
  minimum_common_windows: 0.75
  minimum_support_norm: 0.15
  max_curve_deviation_lane_fraction: 0.10
  max_lane_width_variation: 0.25
  require_ego_containment: true
  ego_containment_margin: 0.10
fit_by_source:
  tusimple:
    expected_lane_width_px: 640
  day:
    window_count: 12
    window_margin: 45
    recenter_min_pixels: 2
    max_lane_width_norm: 0.45
  night:
    window_count: 12
    window_margin: 100
    recenter_min_pixels: 2
    expected_lane_width_px: 640
  rain:
    window_count: 12
    window_margin: 100
    recenter_min_pixels: 2
    expected_lane_width_px: 640
kalman:
  # Initial matrices match the stable synthetic-validation scale in test_kalman.py.
  dt: 1.0
  process_noise: [[1.0e-5, 0, 0, 0, 0, 0], [0, 1.0e-5, 0, 0, 0, 0],
                  [0, 0, 1.0e-5, 0, 0, 0], [0, 0, 0, 1.0e-5, 0, 0],
                  [0, 0, 0, 0, 1.0e-5, 0], [0, 0, 0, 0, 0, 1.0e-5]]
  measurement_noise: [[1.0e-3, 0, 0], [0, 1.0e-3, 0], [0, 0, 1.0e-3]]
  initial_covariance: [[0.01, 0, 0, 0, 0, 0], [0, 0.01, 0, 0, 0, 0],
                       [0, 0, 0.01, 0, 0, 0], [0, 0, 0, 0.01, 0, 0],
                       [0, 0, 0, 0, 0.01, 0], [0, 0, 0, 0, 0, 0.01]]
  gating_threshold: 11.34
departure:
  lane_width_m: 3.7
  on_offset_m: 0.35
  off_offset_m: 0.20
  danger_offset_m: 0.65
  tlc_threshold_s: 1.5
  consecutive_frames: 3
  offset_only_threshold_m: null
evaluation:
  tune_samples: null
  seed: 42
  fps_runs: null
  pixel_threshold_px: null
  lane_accuracy_threshold: null
dataset_metadata:
  tusimple_train_samples: null
  tusimple_test_samples: null
  dashcam_source_kind: null
  dashcam_source_or_license: null
  dashcam_video_count: null
  dashcam_resolution: null
  dashcam_fps: null
  dashcam_device: null
  dashcam_labeled_frames_per_condition: null
course_lessons:
  canny_roi: null
  hough: null
  hls_enhancement: null
  homography: null
  sliding_fit: null
  kalman: null
